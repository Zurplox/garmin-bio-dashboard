name: Daily Biometrics Sync & AI Analysis

on:
  schedule:
    # 08:00 AM SGT (UTC+8) -> 00:00 UTC
    - cron: '0 0 * * *'
    # 08:30 AM SGT catch-up run for any delayed sleep finalization
    - cron: '30 0 * * *'
  workflow_dispatch:

# The 00:00 and 00:30 UTC schedules can overlap because a full sync takes
# several minutes; serialise them so two runners never race to push.
concurrency:
  group: biometrics-sync
  cancel-in-progress: false

# Least privilege: this job commits data and Pages rebuilds from the branch, so
# no Pages/OIDC permissions are needed here.
permissions:
  contents: write

jobs:
  sync-biometrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install garminconnect cryptography

      - name: Restore Garmin Session Tokens
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          mkdir -p ~/.garminconnect
          echo "$GARMIN_TOKENS" | base64 -d > ~/.garminconnect/garmin_tokens.json
          chmod 600 ~/.garminconnect/garmin_tokens.json

      - name: Run Biometric Ingestion & Baseline Sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python sync.py

      - name: Encrypt Biometric Dataset (Zero-Exposure)
        env:
          GARMIN_DASHBOARD_PASS: ${{ secrets.GARMIN_DASHBOARD_PASS || 'Capybara' }}
        run: |
          python encrypt_data.py

      - name: Commit & Push Encrypted Dashboard Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/biometrics.enc.json data/status.json
          if git diff --staged --quiet; then
            echo "No biometric changes to commit."
            exit 0
          fi
          git commit -m "Auto-sync biometrics [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          # The schedules, the catch-up and a manual dispatch can still race the
          # push despite the concurrency group (seen 2026-09-27 02:16 UTC: two
          # runs started seconds apart and the loser failed the whole run with
          # "fetch first"). Rebase onto whatever landed meanwhile and retry:
          # both runs rewrite the same two data files wholesale, so on conflict
          # the fresher vault -- the commit being replayed, i.e. "theirs" in
          # rebase terms -- wins, and a run never dies to a race it can absorb.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            echo "push race on attempt $attempt; retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          exit 1
